assets: Image Gen transparent decorative plates; existing eight-identity resident atlases
renderer: DOM typography and controls; SVG route ink; WAAPI resident movement
page_11: 稳定地图、消费券轻落定，八位居民可点击，选中身份沿用到后页
page_12: 点击揭示流向、真实概率，再点击揭示结算；切换居民重新更新背景和结果
page_13: 沿道路前往商店，成交标记在抵达时出现，数字在本轮行走完成后更新；支持逐轮和连续播放
page_14: 两地图在同一轮次时钟下同步回放，最后揭示累计差异与真实转折轮次
cancellation: 离页清除定时器；反向或跳轮取消旧的行走；陈旧到达回调不得写回指标
reduced_motion: 人物立即定位，概率直接更新，对照直接展示最终状态
